<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<!-- Card de resultado por segmento, 1080x1350. Os dados vêm de cases.json (injetados por render.js em window.CASE). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@500&display=swap" />
<style>
:root { --red: #C4272C; --red-hi: #F0686C; --wine: #70090A; --sand: #F1DBD0; --ink: #F5F3F1; --muted: #A89E9C; --hair: rgba(245,243,241,.18); --slant: skewX(-20deg); --unslant: skewX(20deg); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; background: #0F0C0C; }
.card { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: var(--ink); font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; isolation: isolate; }
.bg { position: absolute; inset: 0; z-index: -3; background: radial-gradient(820px 680px at 88% 18%, rgba(196,39,44,.42), transparent 62%), radial-gradient(760px 560px at -5% 105%, rgba(112,9,10,.55), transparent 62%), #0F0C0C; }
.dots { position: absolute; inset: 0; z-index: -2; background-image: radial-gradient(rgba(245,243,241,.16) 1.5px, transparent 2.2px); background-size: 30px 30px; -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 62%); mask-image: linear-gradient(180deg, #000 0%, transparent 62%); }
.grain { position: absolute; inset: 0; z-index: -1; opacity: .07; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.arrow { position: absolute; z-index: -1; right: -40px; top: 120px; width: 640px; height: 640px; fill: none; stroke: var(--red-hi); stroke-width: 2; opacity: .36; }
.mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
.top { position: absolute; left: 80px; right: 80px; top: 76px; display: flex; align-items: center; justify-content: space-between; }
.top img { height: 50px; width: auto; }
.top .mono { font-size: 19px; color: var(--muted); }
.stack { position: absolute; left: 80px; right: 80px; top: 232px; display: flex; flex-direction: column; }
.plate { align-self: flex-start; transform: var(--slant); padding: 10px 26px; background: var(--red); }
.plate span { display: inline-block; transform: var(--unslant); font: italic 800 28px/1.1 "Archivo", sans-serif; font-stretch: 110%; letter-spacing: .01em; text-transform: uppercase; color: #fff; }
.kicker { margin-top: 34px; font-size: 21px; color: var(--muted); }
.hero { margin-top: 10px; display: flex; align-items: flex-start; gap: 14px; }
.hero .cur { margin-top: 26px; font: 800 58px/1 "Archivo", sans-serif; font-stretch: 112%; color: var(--red-hi); letter-spacing: -.02em; }
.hero .num { font: 800 186px/0.95 "Archivo", sans-serif; font-stretch: 112%; letter-spacing: -.045em; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip { margin-top: 22px; display: flex; align-items: center; gap: 18px; font: 700 36px/1.2 "Archivo", sans-serif; font-stretch: 106%; color: var(--sand); letter-spacing: -.01em; }
.chip b { font-weight: 800; color: #fff; }
.chip i { width: 14px; height: 30px; background: var(--red); transform: var(--slant); flex: none; }
.primary { margin-top: 58px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; }
.m { border-top: 3px solid #fff; padding-top: 22px; min-width: 0; }
.m .big { font: 800 66px/1 "Archivo", sans-serif; font-stretch: 112%; letter-spacing: -.035em; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
.m .big small { font-size: 30px; font-weight: 800; margin-right: 8px; color: var(--red-hi); letter-spacing: 0; }
.m .mono { display: block; margin-top: 14px; font-size: 18px; color: var(--ink); }
.rows { margin-top: 44px; border-top: 1px solid var(--hair); }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding: 19px 0; border-bottom: 1px solid var(--hair); }
.row .mono { font-size: 18px; color: var(--muted); }
.row .val { font: 800 40px/1 "Archivo", sans-serif; font-stretch: 110%; letter-spacing: -.03em; color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .val small { font-size: 22px; margin-right: 6px; color: var(--red-hi); letter-spacing: 0; }
.foot { position: absolute; left: 80px; right: 80px; bottom: 70px; padding-top: 24px; border-top: 1px solid var(--hair); display: flex; justify-content: space-between; align-items: center; }
.foot .mono { font-size: 17px; color: var(--muted); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="bg"></div><div class="dots"></div><div class="grain"></div>
  <svg class="arrow" viewBox="0 0 640 640" aria-hidden="true"><path d="M40 600 L560 80"/><path d="M290 60 H580 V350"/></svg>
  <div class="top"><img src="../../assets/img/logo/lax-color.png" alt="LAX" /><span class="mono" id="topLabel"></span></div>
  <div class="stack">
    <span class="plate"><span id="plate"></span></span>
    <p class="kicker mono" id="kicker"></p>
    <div class="hero"><span class="cur">R$</span><span class="num" id="heroNum"></span></div>
    <p class="chip"><i></i><span id="chip"></span></p>
    <div class="primary" id="primary"></div>
    <div class="rows" id="rows"></div>
  </div>
  <div class="foot"><span class="mono">@laxassessoria</span><span class="mono">Valores aproximados</span></div>
</div>
<script>
(function () {
  var c = window.CASE;
  var money = function (m, v) { return m ? '<small>R$</small>' + v : v; };
  document.getElementById('topLabel').textContent = 'Case · ' + c.title;
  document.getElementById('plate').textContent = c.title;
  document.getElementById('kicker').textContent = c.hero.label;
  var num = document.getElementById('heroNum'); num.textContent = c.hero.value;
  document.getElementById('chip').innerHTML = c.chip.label + ' <b>' + c.chip.value + '</b>';
  document.getElementById('primary').innerHTML = c.primary.map(function (p) {
    return '<div class="m"><div class="big">' + money(p.money, p.value) + '</div><span class="mono">' + p.label + '</span></div>';
  }).join('');
  document.getElementById('rows').innerHTML = c.rows.map(function (r) {
    return '<div class="row"><span class="mono">' + r.label + '</span><span class="val">' + money(r.money, r.value) + '</span></div>';
  }).join('');
  // shrink long numbers so they never leave the margins
  function fit(el, maxW, minPx) { var s = parseFloat(getComputedStyle(el).fontSize); while (el.scrollWidth > maxW && s > minPx) { s -= 2; el.style.fontSize = s + 'px'; } }
  window.addEventListener('load', function () {
    Promise.all([document.fonts.load('800 100px Archivo'), document.fonts.load('italic 800 28px Archivo'), document.fonts.load('500 18px "JetBrains Mono"')]).catch(function () {}).then(function () {
      fit(num, 790, 90);
      Array.prototype.forEach.call(document.querySelectorAll('.m .big'), function (el) { fit(el, el.parentElement.clientWidth, 40); });
      document.body.setAttribute('data-ready', '1');
    });
  });
})();
</script>
</body>
</html>
